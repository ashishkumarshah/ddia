---
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-redis-config
  namespace: cobrakai
data:
  redis.conf: |
    maxmemory 1024mb
    maxmemory-policy allkeys-lru

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: cobrakai
  labels:
    app: broker

spec:
  replicas: 1
  selector:
    matchLabels:
      app: broker

  template:
    metadata:
      labels:
        app: broker

    spec:
      containers:
        - name: redis-container
          image: redis:8.8.0-alpine

          command:
            - redis-server
            - /redis-master/redis.conf

          ports:
            - containerPort: 6379

          resources:
            requests:
              cpu: "1m"

          volumeMounts:
            - name: data
              mountPath: /redis-master-data

            - name: redis-config
              mountPath: /redis-master

      volumes:
        - name: redis-config
          configMap:
            name: my-redis-config

        - name: data
          emptyDir: { }

---
apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: cobrakai

spec:
  type: ClusterIP

  selector:
    app: broker

  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: messagebox-deployment
  namespace: cobrakai
  labels:
    app: messagebox

spec:
  replicas: 1
  selector:
    matchLabels:
      app: messagebox

  template:
    metadata:
      labels:
        app: messagebox

    spec:
      containers:
        - name: redis-container
          image: redis:8.8.0-alpine

          command:
            - redis-server
            - /redis-master/redis.conf

          ports:
            - containerPort: 6379

          resources:
            requests:
              cpu: "1m"

          volumeMounts:
            - name: data
              mountPath: /redis-master-data

            - name: redis-config
              mountPath: /redis-master

      volumes:
        - name: redis-config
          configMap:
            name: my-redis-config

        - name: data
          emptyDir: { }

---
apiVersion: v1
kind: Service
metadata:
  name: messagebox
  namespace: cobrakai

spec:
  type: ClusterIP

  selector:
    app: messagebox

  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
