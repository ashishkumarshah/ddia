apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeline-service
  namespace: cobrakai
  labels:
    app: timeline-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timeline-service
  template:
    metadata:
      labels:
        app: timeline-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      volumes:
        - name: app-data
          emptyDir: { }
      containers:
        - name: timeline-service
          image: ddia-ch02:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: UVICORN_RELOAD
              value: "false"
            - name: DB_PATH
              value: "/app/data/app.db"
            - name: DATABASE_URL
              value: ""
            - name: LOG_LEVEL
              value: "INFO"
            - name: OTEL_SERVICE_NAME
              value: "timeline-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger-collector.cobrakai.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: MESSAGE_BROKER_HOST
              value: "broker.cobrakai.svc.cluster.local"
            - name: MESSAGE_BOX_HOST
              value: "messagebox.cobrakai.svc.cluster.local"
          volumeMounts:
            - name: app-data
              mountPath: /app/data
          command:
            - /app/.venv/bin/opentelemetry-instrument
            - /app/.venv/bin/python
            - main.py
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
