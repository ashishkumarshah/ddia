apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: cobrakai
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: timeline-service
              scrape_interval: 5s
              static_configs:
                - targets: ["timeline-service.cobrakai.svc.cluster.local:80"]
              metrics_path: /metrics

    processors:
      batch: {}

    exporters:
      otlp:
        endpoint: jaeger-collector.cobrakai.svc.cluster.local:4317
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:9464"

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp]
        metrics:
          receivers: [prometheus]
          processors: [batch]
          exporters: [prometheus]
