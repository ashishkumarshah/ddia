apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cobrakai
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector.cobrakai.svc.cluster.local:9464"]
